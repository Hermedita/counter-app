<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CounterApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <app-counter
    heading="Nové počítadlo"
    (saved)="poUlozeni($event)"
  ></app-counter>
  <ion-toast
    [isOpen]="toastOpen()"
    message="Počítadlo bylo uloženo"
    [duration]="500"
    (didDismiss)="toastOpen.set(false)"></ion-toast>
</ion-content>
